services:
  jekyll:
    image: jekyll/jekyll:4.2.2
    ports:
      - "4000:4000"
    volumes:
      - .:/srv/jekyll
      - bundle_cache:/usr/local/bundle
    command: >
      sh -c "
      git config --system --add safe.directory /srv/jekyll &&
      bundle install &&
      bundle exec jekyll serve
      --watch
      --force_polling
      --host 0.0.0.0
      "

volumes:
  bundle_cache:
